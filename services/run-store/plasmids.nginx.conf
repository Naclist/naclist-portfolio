server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name pladb.naclist.site plasmiddb.naclist.site 124.223.76.94 _;

    if ($host = pladb.naclist.site) {
        return 301 https://$host$request_uri;
    }

    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pladb.naclist.site;

    ssl_certificate /etc/letsencrypt/live/pladb.naclist.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pladb.naclist.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 64m;

    location /synthetic-city-api/ {
        limit_except GET POST OPTIONS { deny all; }
        client_max_body_size 2m;
        proxy_pass http://127.0.0.1:5010/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
